name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: # кнопка «Run workflow» в UI

jobs:
  build:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # Android SDK на ubuntu-latest предустановлен (ANDROID_HOME + принятые
      # лицензии), отдельный setup-android не нужен и на новых раннерах падает.
      # В репозитории нет gradlew (jar генерирует Android Studio), поэтому
      # ставим Gradle 8.9 прямо в CI и вызываем `gradle` напрямую.
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          dependency-graph: disabled

      - name: Build debug APK
        run: |
          set -o pipefail
          gradle :app:assembleDebug --stacktrace 2>&1 | tee build-output.log

      # Ошибки компиляции Gradle (строки "e: ..." / "error: ...") превращаем
      # в GitHub-аннотации — их видно в UI и можно читать через публичный API.
      - name: Surface compile errors as annotations
        if: failure()
        run: |
          grep -E '^e: |error: ' build-output.log | head -10 | sed 's/^/::error::/' || true

      - name: Surface failure reason
        if: failure()
        run: |
          grep -A 8 -E 'What went wrong|FAILURE: Build failed' build-output.log | tr '\n' ' ' | cut -c1-600 | sed 's/^/::error::/' || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: krug-zaboty-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
